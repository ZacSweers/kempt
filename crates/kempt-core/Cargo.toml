[package]
name = "kempt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Reusable formatter tool caching and command APIs for kempt"
readme = "README.md"
keywords = ["formatter", "ktfmt", "cache", "kotlin", "java"]
categories = ["development-tools"]

[features]
default = ["cache"]
cache = ["dep:flate2", "dep:tar", "dep:tempfile", "dep:zip", "dep:sha2", "dep:fs2"]
http = ["cache", "dep:ureq"]
commands = ["cache", "http", "dep:globset", "dep:serde", "dep:toml", "dep:toml_edit", "dep:walkdir", "dep:which"]
cli = ["commands", "dep:clap"]

[dependencies]
anyhow.workspace = true
clap = { optional = true, version = "4.6.1", features = ["derive"] }
flate2 = { version = "1.1", optional = true }
fs2 = { version = "0.4.3", optional = true }
sha2 = { version = "0.10.9", optional = true }
globset = { version = "0.4.18", optional = true }
serde = { optional = true, version = "1.0.228", features = ["derive"] }
tar = { version = "0.4", optional = true }
tempfile = { workspace = true, optional = true }
toml = { version = "1.1.2", optional = true }
toml_edit = { version = "0.25", optional = true }
ureq = { version = "3.3.0", optional = true }
walkdir = { version = "2", optional = true }
which = { version = "8.0.2", optional = true }
zip = { optional = true, version = "0.6.6", default-features = false, features = ["deflate"] }

[[example]]
name = "cache_tool"
required-features = ["cache", "http"]

[[example]]
name = "typed_command"
required-features = ["commands"]

[[example]]
name = "cli_command"
required-features = ["cli"]

[[example]]
name = "ktfmt_embed"
required-features = ["cache"]
