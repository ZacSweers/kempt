[workspace]
members = ["crates/kempt-core"]
default-members = [".", "crates/kempt-core"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ZacSweers/kempt"
homepage = "https://github.com/ZacSweers/kempt"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0.102"
tempfile = "3.27.0"
kempt-core = { path = "crates/kempt-core", version = "=0.4.0", default-features = false }

[package]
# The installed binary is `kempt`. The short package name is taken on crates.io.
name = "kempt-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A pre-commit-friendly multi-language formatter (ktfmt, google-java-format, license headers, whitespace)"
readme = "README.md"
keywords = ["formatter", "ktfmt", "google-java-format", "kotlin", "java"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kempt"
path = "src/main.rs"

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow.workspace = true
kempt-core = { workspace = true, features = ["cli"] }

[dev-dependencies]
tempfile.workspace = true
