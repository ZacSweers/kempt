name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cargo-args:
          - "--workspace"
          - "-p kempt-core"
          - "-p kempt-core --no-default-features --features commands"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets ${{ matrix.cargo-args }}
      - run: cargo test --all-targets ${{ matrix.cargo-args }}
      - run: cargo clippy --all-targets ${{ matrix.cargo-args }} -- -D warnings

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
